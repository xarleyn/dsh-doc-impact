name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: Impact semantics
      description: Which rule direction, resolution mode, or detection edge case does this touch? What should happen on session resume, concurrent agents, or a missing config file?
    validations:
      required: true
